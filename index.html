<!DOCTYPE html>
<html lang="en">
<head>

<title>TAP THE TRUTH</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f7f8fb;--ink:#0d1b34;--mut:#56627a;--card:#fff;--line:#d9deea;--blue:#123f8c;--gold:#f0b400;--ok:#137a4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1324;--ink:#eaf0fb;--mut:#9fb0cc;--card:#122040;--line:#26385f;--blue:#7fa8f5;--ok:#4cd08e;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0a1324;--ink:#eaf0fb;--mut:#9fb0cc;--card:#122040;--line:#26385f;--blue:#7fa8f5;--ok:#4cd08e;--bad:#ff8a80}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.65 "Source Serif 4",Georgia,serif;background-image:repeating-linear-gradient(transparent 0 35px,color-mix(in srgb,var(--line) 45%,transparent) 35px 36px)}
h1,h2,h3,.ui{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:880px;margin:auto}
header a{text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:.02em}
nav a{margin-left:16px;font-weight:500;font-size:.95rem}
main{max-width:880px;margin:auto;padding:8px 18px 56px}
.hero{padding:28px 0 12px}
.hero h1{font-size:clamp(3rem,13vw,6.4rem);line-height:.9;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
.hero p{max-width:34em;color:var(--mut);font-size:1.15rem}
.tapbtn{position:relative;display:inline-flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px 28px;font:800 1.1rem "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none}
:root[data-theme="dark"] .tapbtn,:root:not([data-theme="light"]) .tapbtn{color:#06122a}
.tapbtn:after{content:"";position:absolute;inset:-6px;border:2px solid var(--gold);border-radius:999px;animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.94);opacity:1}100%{transform:scale(1.18);opacity:0}}
@media(prefers-reduced-motion:reduce){.tapbtn:after{animation:none;opacity:.6}}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0;padding:0;list-style:none}
.flow li{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font:500 .9rem "Bricolage Grotesque",sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--c)}
.tile b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem;display:block}
.tile span{color:var(--mut);font-size:.93rem;display:block}
.tile em{font:600 .82rem "Bricolage Grotesque",sans-serif;font-style:normal;color:var(--ok)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:16px 0}
.panel h2{margin:0 0 6px;font-size:1.3rem}
.stage{font:600 .9rem "Bricolage Grotesque",sans-serif;color:var(--mut);margin:0 0 4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--bg);border:2px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.fb{margin-top:8px;font-size:.98rem}
input[type=number]{padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:12em;font:inherit;margin:4px 12px 4px 0}
label{display:block}
.cbrow{display:grid;grid-template-columns:8.5em 1fr;gap:10px;align-items:center;width:100%;margin:6px 0;padding:6px 8px;border:2px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cbrow[aria-pressed="true"]{border-color:var(--gold);background:var(--card)}
.cbtrack{background:var(--line);border-radius:6px;height:26px;overflow:hidden;position:relative;display:block}
.cbfill{display:block;height:100%;background:var(--blue);min-width:2px}
.cbval{font:800 .95rem "Bricolage Grotesque",sans-serif;position:absolute;left:8px;top:2px;color:#fff;text-shadow:0 0 3px #000}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0}
.stack i{display:block;height:100%}
.legend span{display:inline-block;margin-right:14px;font:600 .9rem "Bricolage Grotesque",sans-serif}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
select{padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
details summary{cursor:pointer}
textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button.sec,a.sec{display:inline-block;margin:8px 8px 0 0;padding:10px 18px;border-radius:9px;border:2px solid var(--blue);background:transparent;color:var(--blue);font:600 .95rem "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none}
.tag{display:inline-block;background:var(--c);color:#111;border-radius:6px;padding:2px 10px;font:800 .85rem "Bricolage Grotesque",sans-serif}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qc{background:#fff;color:#111;border:1px solid var(--line);border-top:8px solid var(--c);border-radius:10px;padding:12px;text-align:center;break-inside:avoid}
.qc div.q{display:flex;justify-content:center;margin:8px 0}
.qc small{display:block;word-break:break-all;font:.7rem monospace;color:#444}
.scroll{overflow-x:auto}
@media print{header,.noprint{display:none}body{background:#fff}}
</style>
</head>

<script>
var T=[
{c:"#2f6fdb",n:"What's the Truth?",s:"Why flood control budgets get audited",d:"Flood control means structures like riverbank protection, flood walls and drainage. Its budget grew fast: one UP CIDS policy paper reports appropriations rose from about ₱79 billion in 2016 to over ₱200 billion a year by 2021. After public concern about 'ghost projects', COA Chairperson Gamaliel Cordoba ordered on 12 August 2025 a fraud audit of all DPWH flood control projects in Bulacan from 1 July 2022 to 30 May 2025.",k:["Flood control is public money for public safety, so the public must be able to verify it","COA's fraud audit asks: did the structure exist, was it built where contracted, and were payments supported?","Bulacan alone accounted for about ₱98 billion, roughly 18%, of DPWH flood control projects for 2022 to 2025, per Cordoba"],links:[["News: COA fraud audit order (GMA)","https://www.gmanetwork.com/news/topstories/nation/958420/coa-p341-million-worth-of-flood-control-projects-substandard-non-existent/story/"],["UP CIDS: Flood-Control Fiasco","https://cids.up.edu.ph/flood-control-fiasco-a-policy-reckoning-for-accountability-in-the-philippines/"]],qs:[{q:"COA's fraud audit of Bulacan flood control projects covered which period?",o:["1 Jan 2020 to 31 Dec 2021","1 July 2022 to 30 May 2025","2010 to 2014","Only 2025"],a:1,e:"The audit directive covered DPWH flood control projects from 1 July 2022 to 30 May 2025."},{q:"Why does a flood control budget need independent auditing?",o:["It is small and simple","It is large public money that people cannot easily verify on their own","Because engineers ask for it","Only for tax reasons"],a:1,e:"Large, technical, public-safety spending is hard for citizens to verify, so independent auditors check it."}],u:"A flood wall you cannot see being built is easy to pay for and hard to check. Auditing exists to close that gap.",w:"Flood control is also where budget size, project location and contractor payments all meet, which makes it a good case for learning how public budgets work.",act:"Pick a flood-prone place you know.",as:["Write down one flood control structure near you (or one that should exist).","List three questions you would ask before agreeing its budget was well spent."]},
{c:"#1f9d55",n:"Know COA",s:"How COA audits flood control projects",d:"COA used physical inspections, drone surveillance, geotagged photographs and historical satellite imagery to test flood control projects. It reported patterns such as ghost projects, unauthorized relocation of project sites, payments for pre-existing structures and serious documentation gaps. It filed fraud audit reports with the Ombudsman and the Independent Commission for Infrastructure (since defunct), and issued notices of disallowance where its fraud audits supported them. More recently Cordoba said fraud audits covered almost 50 projects, focused on DPWH and its Bulacan personnel.",k:["Satellite imagery can show whether a structure existed before the contract took effect","Geotagged photos and drone views test location and existence","Notice of disallowance: COA's action refusing a payment it finds improper"],links:[["News: COA findings, Jan 2026 (GMA)","https://www.gmanetwork.com/news/topstories/nation/973514/coa-finds-fraud-in-over-p325-m-flood-control-projects-in-bulacan/story/"],["News: nearly 50 projects under fraud audit (GMA)","https://www.gmanetwork.com/news/topstories/nation/1001028/coa-nearly-50-flood-control-projects-under-fraud-audit/story/"]],qs:[{q:"How can COA test whether a riverbank structure already existed before a contract began?",o:["Ask the contractor","Review historical satellite imagery","Read the budget speech","Count the invoices"],a:1,e:"COA reported using historical satellite imagery for exactly this."},{q:"What is a notice of disallowance?",o:["A bonus for agencies","COA's action refusing a payment it finds improper","A new contract","A tax bill"],a:1,e:"Disallowance means the expense is not allowed in the accounts, and responsible persons may have to return it."}],u:"Modern audits combine field checks with technology. A signed document is no longer enough proof that something was built.",w:"COA's Fraud Audit Office files its findings so that other bodies can act. Audit findings become evidence, not verdicts.",act:"Match the tool to the question.",as:["Write which tool (drone, satellite image, geotagged photo, documents) best answers: 'Does it exist?', 'Is it in the right place?', 'Was it there before the contract?'","Explain in one sentence why one tool alone is not enough."]},
{c:"#e0a800",n:"Know the Rules",s:"The budget cycle and flood control rules",d:"Budget path: DBM prepares the National Expenditure Program (NEP) and it goes to Congress. Congress amends it, the bicameral conference committee reconciles both houses, the President signs the General Appropriations Act (GAA), and DBM releases funds based on what the GAA itemizes. DPWH then plans, bids and builds, and COA audits. Watchdogs have flagged 'insertions', where GAA amounts far exceed the NEP: an Inquirer report cites a DPWH program that requested ₱174.08B in the 2024 NEP but received ₱410.9B in the GAA.",k:["NEP (proposal) → Congress → Bicam → GAA (law) → DBM release → DPWH implements → COA audits","The 2026 GAA DPWH provisions require satellite-based, geospatial validation of flood control projects with a dashboard shared with DBM, DEPDev and COA","It also requires DPWH to publish original vs updated project costs with justification"],links:[["2026 GAA: DPWH provisions (DBM)","https://www.dbm.gov.ph/wp-content/uploads/GAA/GAA2026/VolumeIB/DPWH/DPWH.pdf"],["News: 'insertions' explained (Inquirer)","https://newsinfo.inquirer.net/2111427/beyond-flood-mess-more-dpwh-insertions-tagged"]],qs:[{q:"Which is the correct order?",o:["GAA → NEP → Bicam → COA","NEP → Congress deliberation → Bicam → GAA → release","COA audit → NEP → GAA","Release → NEP → GAA"],a:1,e:"The executive proposes (NEP), Congress amends and reconciles, the GAA becomes law, then funds are released."},{q:"Who releases funds according to what the GAA itemizes?",o:["COA","DBM","The contractor","The Ombudsman"],a:1,e:"DBM said it releases funds based on what Congress approved in the budget law."}],u:"Each stage is a checkpoint. Problems can enter at proposal, amendment, release, bidding or building, so auditors look at all of them.",w:"The 2026 GAA now wires COA into a geospatial dashboard. Rules are changing to make verification routine, not exceptional.",act:"Find the checkpoint.",as:["Draw the six-step budget path on paper.","Mark the step where you think a wasteful project is easiest to slip in, and explain why in two sentences."]},
{c:"#f2771a",n:"Follow the Money",s:"The numbers behind flood control budgets",d:"2026 NEP: DPWH proposed ₱881.31B. Locally funded flood control projects worth ₱263.54B were excluded, and the final 2026 GAA gave DPWH ₱530.89B, which is ₱350.42B (nearly 40%) lower than the proposal. Only foreign-assisted flood control projects (which need counterpart funds) stayed, plus about ₱2.49B for maintenance of existing flood control facilities. For 2027, DBM's proposal includes about ₱107.4B for flood control, around 16% of DPWH's proposed ₱644B.",k:["₱881.31B proposed → ₱530.89B enacted (2026)","₱2.49B maintenance for existing flood works in 2026","₱107.4B flood control proposed in 2027, about 16% of DPWH's ₱644B"],tool:"gap",links:[["PIA: DPWH 2026 budget","https://pia.gov.ph/news/dpwh-pushes-transparent-infrastructure-spending-under-2026-budget/"],["Rappler: 2027 flood control proposal","https://www.rappler.com/philippines/dpwh-flood-control-project-budget-proposal-2027/"]],qs:[{q:"By how much was the 2026 GAA for DPWH below its NEP proposal (₱881.31B vs ₱530.89B)?",o:["₱150.42B","₱350.42B","₱550.42B","₱35.04B"],a:1,e:"881.31 − 530.89 = 350.42 billion."},{q:"A ₱107.4B flood control budget within a ₱644B DPWH budget is roughly...",o:["1.6%","16%","60%","160%"],a:1,e:"107.4 ÷ 644 ≈ 0.167, so about 16 to 17%."},{q:"A project costs ₱55M, is recorded 100% paid, but only 20% is verified built on site. What is the unsupported amount?",o:["₱11M","₱44M","₱55M","₱0"],a:1,e:"Paid ₱55M minus verified value ₱11M = ₱44M needing explanation."}],u:"Budget totals tell you the scale. The gap between amount paid and value verified on site tells you the risk.",w:"COA reported cases where nearly all of a contract was paid while the structure was missing, relocated or already existed. That is why 'percent paid' must be matched to 'percent verified'.",act:"Compute a gap.",as:["Use the calculator above with a project you invent or a figure from a news report.","Write what documents the agency would need to close the gap."]},
{c:"#d7263d",n:"Show the Receipts",s:"Documents that prove a flood control project",d:"COA said 'egregious' documentation gaps undermined the credibility of reported accomplishments and payments. In Bulacan, the DPWH 1st District Engineering Office did not submit key supporting documents to COA, and contractors failed to submit disbursement vouchers, so notices of disallowance were issued. Without receipts and records, nobody can verify what was paid for.",k:["Supporting documents are the audit trail","Missing vouchers and records can lead to disallowance","Evidence must match the physical structure on site"],tool:"docs",links:[["News: documentation gaps (GMA)","https://www.gmanetwork.com/news/topstories/nation/967908/coa-fraud-audit-reports-filed-bulacan-flood-control-projects-p297m/story/"],["News: COA files with Ombudsman (Inquirer)","https://newsinfo.inquirer.net/2106272/coa-files-in-ombudsman-fraud-audit-report-on-bulacan-flood-control-projects"],["COA: Annual Audit Reports","https://www.coa.gov.ph/reports/annual-audit-reports/"]],qs:[{q:"What happened when contractors did not submit disbursement vouchers, per COA?",o:["Nothing","Notices of disallowance were issued","Contracts were doubled","Audits were cancelled"],a:1,e:"COA reported issuing notices of disallowance partly because vouchers were not submitted."},{q:"Which is the strongest red flag?",o:["A late report","Satellite images showing the structure existed years before the contract","A long project title","A new logo"],a:1,e:"Paying for a pre-existing structure means public funds may have paid for work that was not newly built."}],u:"A receipt only helps if it can be matched to something real. Records and reality must agree.",w:"The 2026 GAA also requires DPWH to publish revised project costs with justifications, so more of this trail is meant to be public.",act:"Build a checklist.",as:["Tick the checklist above for a project you know (or imagine).","Circle the document you think is most often missing and say why."]},
{c:"#8e44ad",n:"Who's Accountable?",s:"Case: four Bulacan projects COA flagged",d:"Case from COA's reports, as covered by media: a ₱96.4M river structure in Calumpit had a ₱38.4M pricing discrepancy between DPWH and COA's evaluation; a ₱39M Plaridel structure was found overpaid by ₱3M and substandard; a ₱55M river wall in Baliuag had no construction found on site; a ₱96.49M riverbank structure in Guiguinto appeared built elsewhere without authority. COA named DPWH district engineers and contractors as responsible and said charges could include graft, malversation and falsification. These are audit findings; cases are for the proper courts and the Ombudsman to decide.",k:["Accountability is by role: engineers who certify, officials who approve, contractors who bill","COA findings are evidence for the Ombudsman and courts","Possible charges cited: Anti-Graft law, malversation of public funds, falsification of documents"],links:[["News: first batch of fraud audits (GMA)","https://www.gmanetwork.com/news/topstories/nation/958420/coa-p341-million-worth-of-flood-control-projects-substandard-non-existent/story/"],["News: seventh fraud audit report (Rappler)","https://www.rappler.com/philippines/luzon/coa-fraud-audit-defective-flood-control-projects-bulacan-november-12-2025/"]],qs:[{q:"In the Plaridel case, what was found?",o:["A perfect structure","Overpayment of ₱3M and substandard work","A missing budget","No contractor"],a:1,e:"COA found the government overpaid by ₱3M and the work was substandard."},{q:"Who does COA say should be held accountable in these cases?",o:["Only citizens","DPWH district officials and contractors, depending on their roles","Only the weather","No one"],a:1,e:"COA named DPWH engineers and contractor representatives for specific projects."},{q:"COA's fraud audit findings are best described as...",o:["Final court verdicts","Evidence submitted for Ombudsman action","Optional advice","Marketing"],a:1,e:"They form part of the evidentiary record for other bodies to decide."}],u:"Accountability names roles and evidence. It does not replace due process.",w:"Being precise matters: 'COA found' and 'a court convicted' are very different statements.",act:"Assign responsibility fairly.",as:["For one case above, list who certified, who paid, who built.","State what evidence you would still need before saying anyone is guilty."]},
{c:"#8d6e63",n:"Can You Find It?",s:"Checking flood control spending yourself",d:"Public information is only useful if you can locate it. The 2026 GAA requires an online dashboard of satellite-based validation of flood control projects, shared with DBM, DEPDev and COA, and DPWH must publish cost-update reports on its website. COA publishes annual audit reports by agency and LGU, and its Citizen Participatory Audit lets civil society members join audit teams.",k:["GAA text: read what the law itself requires","COA Annual Audit Reports: findings for your LGU or agency","Citizen Participatory Audit: citizens inside audit teams"],links:[["COA: AAR for Local Government Units","https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/"],["COA: CPA reports","https://www.coa.gov.ph/reports/citizen-participatory-audit-reports/"],["2026 GAA: DPWH provisions","https://www.dbm.gov.ph/wp-content/uploads/GAA/GAA2026/VolumeIB/DPWH/DPWH.pdf"]],qs:[{q:"Which source would show audit findings for your city's spending?",o:["COA Annual Audit Reports for LGUs","A movie trailer","Weather app","Sports site"],a:0,e:"COA posts LGU annual audit reports by year."},{q:"Under the 2026 GAA, who receives the flood control validation dashboard?",o:["DBM, DEPDev and COA","Only contractors","Only the media","Nobody"],a:0,e:"The GAA says findings are published through a dashboard shared with DBM, DEPDev and COA."}],u:"Being able to look is the start of accountability. Students who know where to look can ask better questions.",w:"COA has also said it will keep fraud audits going 'until we cover them all'. Public attention helps keep that momentum.",act:"Do a real lookup.",as:["Open COA's Annual Audit Reports for LGUs and pick the latest year and your city or province.","Search the report for words like 'infrastructure', 'drainage', or 'flood'. Write what you found or that you found nothing."]},
{c:"#9aa5b8",n:"Trust Check",s:"Numbers, claims and public trust",d:"Trust needs careful reading. Reports on the 2026 removal of locally funded flood control differ: ₱263.54B (DPWH/PIA), about ₱252B (Rappler), and ₱255.5B reallocated (PNA). Different documents count different stages (NEP, revisions, reallocation). In 2027, ₱107.4B is proposed for flood control again, framed as funding for ongoing projects. Budget watchdogs also warn that cutting one line item does not fix weak controls.",k:["Always cite which document a figure comes from and at what stage","Different numbers can come from different stages, not necessarily errors","Trust grows when claims are checkable"],links:[["PNA: ₱255.5B reallocation","https://www.pna.gov.ph/articles/1259703"],["PIA: ₱263.54B excluded","https://pia.gov.ph/news/dpwh-institutes-reforms-under-reduced-budget-for-2026/"],["Inquirer: 2027 proposal","https://newsinfo.inquirer.net/2282813/flood-control-back-in-palaces-2027-budget-proposal"]],qs:[{q:"Why might reports give different totals for removed flood control funds?",o:["They count different stages or documents","Numbers change randomly","Journalists never check","Because of time zones"],a:0,e:"NEP, revised NEP and reallocation figures are different snapshots."},{q:"Best professional habit when quoting a budget number?",o:["Round it","Cite the document and stage it came from","Use the biggest one","Use the smallest one"],a:1,e:"Citing the source and stage lets others verify the figure."}],u:"Transparency is not just publishing numbers. It is making them traceable and comparable.",w:"As a future accountant, you will be the one reconciling figures like these.",act:"Reconcile two numbers.",as:["Take two flood control figures from the sources above.","Write one sentence explaining what stage each might represent, and what you would check to reconcile them."]},
{c:"#f0b400",n:"Audit Challenge",s:"Apply flood control budgeting",d:"Answer all five questions. Use the earlier cards as reference.",k:[],links:[["Review: COA Annual Audit Reports","https://www.coa.gov.ph/reports/annual-audit-reports/"]],qs:[{q:"What is the GAA?",o:["The proposal DBM submits","The enacted budget law","A COA report","A contract"],a:1,e:"The General Appropriations Act is the enacted budget."},{q:"₱881.31B proposed vs ₱530.89B enacted. What is the reduction?",o:["₱250.42B","₱350.42B","₱450.42B","₱100B"],a:1,e:"881.31 − 530.89 = 350.42."},{q:"A ₱80M contract shows 100% paid and 25% verified. Unsupported amount?",o:["₱20M","₱60M","₱80M","₱25M"],a:1,e:"Paid ₱80M minus verified ₱20M = ₱60M."},{q:"Which evidence best shows a structure existed before a contract?",o:["Historical satellite imagery","The contractor's brochure","A press release","A signed thank-you card"],a:0,e:"COA used historical satellite imagery."},{q:"A COA fraud audit report is...",o:["A final conviction","Evidence provided to bodies like the Ombudsman","A budget","A tax return"],a:1,e:"COA filed reports as evidence for further proceedings."}],u:"You now know the path of a flood control peso, the numbers, the evidence, and who answers for it.",w:"These are the same steps a practicing auditor follows.",act:"Plan your review.",as:["List the question you missed.","Return to that card and redo its Act task."]},
{c:"#c9a227",n:"Your Turn",s:"What you will do as a professional",d:"Accountants, engineers, procurement officers and business owners handle the paperwork behind projects like these. Concrete habits protect the public and protect you: verify before you sign, keep complete records, reconcile numbers to sources, and raise concerns early through proper channels such as COA and the Ombudsman.",k:["Verify before you certify","Keep complete, retrievable records","Cite the source and stage of every figure","Speak up early and follow proper channels"],links:[["COA homepage","https://www.coa.gov.ph/"],["COA: Citizen Participatory Audit","https://www.coa.gov.ph/FAQS/what-is-citizens-participatory-audit-cpa/"]],qs:[],u:"One professional who refuses to sign an unchecked payment can stop a much larger loss.",w:"Behind every ghost project were people who signed papers. Your signature will matter too.",act:"Write your commitment.",as:["Choose one habit from the list.","Describe the exact situation in your first job where you will use it, and what you will say if pressured to skip it."]}

 document.querySelectorAll("#chips button").forEach(function(b){b.onclick=function(){f=b.dataset.f;sv("lw_f",f);document.querySelectorAll("#chips button").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.f===f)});draw()}});
 $("#sx").oninput=draw;draw();
 $("#sq").onchange=function(){var v=this.value;if(v===""){$("#sr").innerHTML="";return}$("#sr").innerHTML='<p>These apply:</p>'+SC[+v].k.map(function(k){return item(LW.filter(function(x){return x.k===k})[0])}).join("")};
 window.scrollTo(0,0)}
function route(){var h=location.hash.split("/");if(h[1]==="t")tap(+h[2]);else if(h[1]==="about")about();else if(h[1]==="cards")cards();else if(h[1]==="coa-budget")coab();else if(h[1]==="laws")laws();else home()}
window.addEventListener("hashchange",route);route();
$("#th").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
</script>
